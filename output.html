<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Output</title>
<link rel="icon" href="data:,">
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
body.idle { cursor: none; }
#gl, #still, #card { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#still, #card { pointer-events: none; opacity: 0; }
#still { transition: opacity .6s; }
#still.on, #card.on { opacity: 1; }
#black { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 1s linear; }
#black.on { opacity: 1; }
@font-face { font-family: 'IBM Plex Sans Condensed'; font-weight: 500; src: url('fonts/ibm-plex-sans-condensed-latin-500-normal.woff2') format('woff2'); }
.reach-labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.rl { position: absolute; left: 0; top: 0; font: 500 18px 'IBM Plex Sans Condensed', sans-serif; color: #07090e; background: rgba(236, 238, 242, 0.88); padding: 2px 6px; white-space: nowrap; }
.playhead { position: fixed; top: 0; bottom: 0; left: 50%; width: 0; border-left: 2px solid rgba(46, 74, 140, 0.85); pointer-events: none; }
.section-inset { position: fixed; right: 16px; top: 16px; pointer-events: none; }
.playhead[hidden], .section-inset[hidden] { display: none; }
.map-inset { position: fixed; left: 16px; bottom: 56px; pointer-events: none; }
.map-inset canvas { display: block; }
.map-inset canvas + canvas { position: absolute; left: 0; top: 0; }
.map-inset[hidden] { display: none; }
#facts { position: fixed; left: 16px; bottom: 12px; font: 500 18px 'IBM Plex Sans Condensed', sans-serif; color: #07090e; background: rgba(236, 238, 242, 0.88); padding: 4px 8px; pointer-events: none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="still" width="960" height="540"></canvas>
<canvas id="card"></canvas>
<div id="labels" class="reach-labels" hidden></div>
<div id="playhead" class="playhead" hidden></div>
<canvas id="section" class="section-inset" hidden></canvas>
<div id="facts" hidden></div>
<div id="wallblend" class="wall-blend-root"></div>
<canvas id="wallcard" class="wall-card" hidden></canvas>
<div id="black"></div>
<script type="module" src="src/output.js"></script>
</body>
</html>
